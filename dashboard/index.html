<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PnL Lens</title>
<style>/*UI-CSS*/</style>
</head>
<body>
<!--UI-BODY-->
<script id="pnl-core">
/* PnL Lens core: parses Bitunix tax-report CSVs and computes PnL analytics.
   Pure functions, no DOM access, so Node tests can run this block. */
(function (root) {
  'use strict';

  var DAY = 86400000;
  var EMPTY = { '': 1, '—': 1, '–': 1, '-': 1, 'N/A': 1, 'n/a': 1, 'null': 1, 'NULL': 1 };
  var STABLES = { USDT: 1, USDC: 1, FDUSD: 1, USD: 1 };
  var WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var SEP = '␟';

  var CATEGORY_LABELS = {
    realized: ['PnL', 'CFD Realized PnL', 'Coupon Position PnL', 'Liquidation Settlement', 'CFD Liquidation', 'Coupon Position Liquidation'],
    fee: ['Futures Fee', 'Guranteed SL Fee', 'Guaranteed SL Fee', 'CFD Swap Fee', 'Card FX Fee', 'Card Small-Value Fee',
      'Event Registration Fee', 'Event Registration Fee Refund', 'Profit Shared'],
    funding: ['Funding Cost'],
    income: ['Referral Commission', 'Referral Cashback', 'Gifts & Rewards', 'Other Rewards', 'Trading Bonus', 'Reward Tokens',
      'Lead Trader Income', 'Negative Balance Compensation', 'CFD Dividend', 'CFD Compensation', 'Earnings', 'Card Cashback',
      'Card Reward', 'Fortune Fund Profit Share'],
    event: ['Event Contract Order', 'Event Contract Payment', 'Event Contract Cancellation', 'Futures Event Contract Order',
      'Futures Event Contract Payment', 'Futures Event Contract Cancel'],
    cashflow: ['Deposit', 'Withdrawal', 'Fiat Deposit', 'Fiat Withdrawal', 'Fiat Exchange', 'Bank Transfer Buy', 'P2P Buy', 'P2P Sell',
      'Card Deposit', 'Third-Party', 'Card Transfer In', 'Card Transfer Out', 'Card Payment', 'Card Refund', 'Card Reversal',
      'Card Credit', 'Card Settlement Advance', 'Card Advance Repayment', 'Card Manual Adjustment In', 'Card Manual Adjustment Out'],
    internal: ['Transfer', 'Internal Transfer', 'Main / Sub Account Transfer', 'Transfer (Copy Trading)', 'Transfer (Bot)', 'CFD Transfer'],
    earn: ['Flexible Subscription', 'Flexible Redemption', 'Fixed-Term Subscription', 'Fixed Term Redemption',
      'Dual Product Subscription', 'Dual Product Settlement'],
    bonus: ['Trial Fund', 'Bonus Redemption', 'Fortune Bonus Withdrawal', 'Fortune Fund', 'Fortune Fund Recalled',
      'Fortune Fund Withdrawal', 'Gift Fund Withdrawal', 'Coupon Margin Transfer', 'Coupon Margin Recall'],
    conversion: ['Buy Order', 'Sell Order', 'Convert', 'Convert Small Balance', 'Futures Convert'],
    other: ['Repay']
  };
  var LABEL_CAT = {};
  Object.keys(CATEGORY_LABELS).forEach(function (cat) {
    CATEGORY_LABELS[cat].forEach(function (l) { LABEL_CAT[l.toLowerCase()] = cat; });
  });
  var FUTURES_LABELS = {};
  ['PnL', 'Futures Fee', 'Funding Cost', 'Liquidation Settlement', 'Guranteed SL Fee', 'Guaranteed SL Fee',
    'Coupon Position PnL', 'Coupon Position Liquidation'].forEach(function (l) { FUTURES_LABELS[l.toLowerCase()] = 1; });
  var PERF = { realized: 1, spot: 1, event: 1, fee: 1, funding: 1, income: 1 };

  function classify(label) {
    return LABEL_CAT[String(label || '').trim().toLowerCase()] || null;
  }

  // ---- parsing ----

  function parseCSV(text) {
    var rows = [], row = [], field = '', inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false;
        } else field += c;
      } else if (c === '"' && field === '') inQ = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function cell(v) {
    var s = v == null ? '' : String(v).trim();
    return EMPTY[s] ? '' : s;
  }
  function amount(v) {
    var s = cell(v);
    if (s === '') return 0;
    var n = parseFloat(s.replace(/,/g, ''));
    return isFinite(n) && /^[-+]?[\d.,]+(e[-+]?\d+)?$/i.test(s) ? n : NaN;
  }
  function parseDate(s) {
    var m = /(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(String(s || ''));
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) : null;
  }
  function dayKey(ts) { return new Date(ts).toISOString().slice(0, 10); }
  function monthKey(ts) { return new Date(ts).toISOString().slice(0, 7); }
  function dayStart(ts) { return Math.floor(ts / DAY) * DAY; }
  function weekKey(ts) {
    var d = new Date(ts), wd = (d.getUTCDay() + 6) % 7;
    return dayKey(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - wd));
  }
  function balanceFrom(line) {
    var n = parseFloat(line.slice(line.lastIndexOf(':') + 1).replace(/,/g, ''));
    var when = /(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) UTC/.exec(line);
    return { value: isFinite(n) ? n : null, at: when ? when[1] + ' UTC' : null };
  }

  var COLS = { date: 'date (utc)', label: 'label', account: 'account', outAsset: 'outgoing asset', outAmt: 'outgoing amount',
    inAsset: 'incoming asset', inAmt: 'incoming amount', feeAsset: 'fee asset', feeAmt: 'fee amount', typeId: 'type id',
    txid: 'txid', network: 'network', ref: 'reference id', comment: 'comment' };

  function parseReport(text, fileName) {
    text = String(text || '').replace(/^﻿/, '');
    var table = parseCSV(text), warnings = [];
    var h = -1;
    for (var i = 0; i < table.length && h < 0; i++) {
      var r = table[i];
      if (r.length > 3 && /^date/i.test(String(r[0]).trim()) &&
        r.some(function (c) { return String(c).trim().toLowerCase() === 'label'; })) h = i;
    }
    if (h < 0) {
      throw new Error('No transaction header found. Expected a row starting with "Date (UTC),Label,...". ' +
        'Export the tax report from Bitunix as CSV and upload it unchanged.');
    }
    var meta = { platform: null, exportDate: null, uid: null, period: null, opening: null, closing: null,
      dataTypes: [], fileName: fileName || null };
    table.slice(0, h).forEach(function (r) {
      var line = r.join(',').trim(), m;
      if (!line || /^-{5,}$/.test(line)) return;
      if ((m = /^Platform:\s*(.+)$/i.exec(line))) meta.platform = m[1].trim();
      else if ((m = /^Export Date:\s*(.+)$/i.exec(line))) meta.exportDate = m[1].trim();
      else if ((m = /^User UID:\s*(.+)$/i.exec(line))) meta.uid = m[1].trim();
      else if ((m = /^Period:\s*(.+)$/i.exec(line))) meta.period = m[1].trim();
      else if (/^Data Types:/i.test(line)) {
        meta.dataTypes = line.split(/\r?\n/).slice(1).map(function (s) { return s.trim(); }).filter(Boolean);
      } else if (/^Opening Balance/i.test(line)) meta.opening = balanceFrom(line);
      else if (/^Closing Balance/i.test(line)) meta.closing = balanceFrom(line);
    });
    var header = table[h].map(function (x) { return String(x).trim().toLowerCase(); });
    var col = {};
    Object.keys(COLS).forEach(function (k) { col[k] = header.indexOf(COLS[k]); });
    ['date', 'label', 'outAsset', 'outAmt', 'inAsset', 'inAmt'].forEach(function (k) {
      if (col[k] < 0) throw new Error('Missing column "' + COLS[k] + '" in the CSV header.');
    });
    function get(r, k) { return col[k] >= 0 ? r[col[k]] : ''; }
    var rows = [];
    table.slice(h + 1).forEach(function (r, i) {
      if (r.every(function (c) { return String(c).trim() === ''; })) return;
      var line = h + i + 2, ts = parseDate(get(r, 'date'));
      if (ts == null) { warnings.push('Line ' + line + ': unreadable date "' + get(r, 'date') + '", row skipped.'); return; }
      var o = amount(get(r, 'outAmt')), n = amount(get(r, 'inAmt')), f = amount(get(r, 'feeAmt'));
      if (isNaN(o) || isNaN(n) || isNaN(f)) { warnings.push('Line ' + line + ': unreadable amount, row skipped.'); return; }
      rows.push({
        ts: ts, line: line, label: cell(get(r, 'label')), account: cell(get(r, 'account')) || 'Main',
        outAsset: o ? cell(get(r, 'outAsset')).toUpperCase() : '', outAmt: o,
        inAsset: n ? cell(get(r, 'inAsset')).toUpperCase() : '', inAmt: n,
        feeAsset: f ? cell(get(r, 'feeAsset')).toUpperCase() : '', feeAmt: f,
        typeId: cell(get(r, 'typeId')), txid: cell(get(r, 'txid')), network: cell(get(r, 'network')),
        ref: cell(get(r, 'ref')), comment: cell(get(r, 'comment')),
        key: r.map(function (c) { return String(c).trim(); }).join(SEP)
      });
    });
    if (rows.length > 1 && rows[0].ts > rows[rows.length - 1].ts) rows.reverse();
    return { meta: meta, rows: rows, warnings: warnings };
  }

  function mergeReports(reports) {
    var maxCount = {}, warnings = [], dupes = 0;
    reports.forEach(function (rep, fi) {
      var counts = {};
      rep.rows.forEach(function (r, i) {
        counts[r.key] = (counts[r.key] || 0) + 1;
        r._order = fi * 1e7 + i;
      });
      Object.keys(counts).forEach(function (k) { maxCount[k] = Math.max(maxCount[k] || 0, counts[k]); });
      rep.warnings.forEach(function (w) { warnings.push((rep.meta.fileName ? rep.meta.fileName + ': ' : '') + w); });
    });
    var used = {}, rows = [];
    reports.forEach(function (rep) {
      rep.rows.forEach(function (r) {
        var n = used[r.key] || 0;
        if (n < maxCount[r.key]) { used[r.key] = n + 1; rows.push(r); } else dupes++;
      });
    });
    rows.sort(function (a, b) { return a.ts - b.ts || a._order - b._order; });
    rows.forEach(function (r, i) { r.seq = i; });
    var metas = reports.map(function (r) { return r.meta; });
    var meta = Object.assign({}, metas[0]);
    meta.fileNames = metas.map(function (m) { return m.fileName; }).filter(Boolean);
    var withBal = function (k) { return metas.map(function (m) { return m[k]; }).filter(function (b) { return b && b.value != null; }); };
    meta.closing = withBal('closing').sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); })[0] || null;
    meta.opening = withBal('opening').sort(function (a, b) { return String(a.at).localeCompare(String(b.at)); })[0] || null;
    return { meta: meta, rows: rows, warnings: warnings, duplicates: dupes };
  }

  // ---- model: rows -> USDT-valued events and trades ----

  function buildModel(merged) {
    var rows = merged.rows, warnings = merged.warnings.slice(), unknown = {};
    var obs = {};
    rows.forEach(function (r) {
      if (!r.inAsset || !r.outAsset) return;
      if (STABLES[r.outAsset] && !STABLES[r.inAsset]) (obs[r.inAsset] = obs[r.inAsset] || []).push([r.ts, r.outAmt / r.inAmt]);
      if (STABLES[r.inAsset] && !STABLES[r.outAsset]) (obs[r.outAsset] = obs[r.outAsset] || []).push([r.ts, r.inAmt / r.outAmt]);
    });
    function priceAt(asset, ts) {
      var list = obs[asset], best = null, gap = Infinity;
      if (!list) return null;
      list.forEach(function (o) {
        var g = o[0] >= ts ? o[0] - ts : (ts - o[0]) * 2 + 1;
        if (g < gap) { gap = g; best = o[1]; }
      });
      return best;
    }
    var holdings = {}, unvalued = {}, events = [], trades = [];
    function hold(a) { return holdings[a] || (holdings[a] = { qty: 0, cost: 0, bought: false }); }
    function push(r, cat, value, extra) {
      var e = Object.assign({ ts: r.ts, seq: r.seq, cat: cat, value: value, label: r.label, account: r.account, market: null, row: r }, extra);
      events.push(e);
      return e;
    }
    // Value a one-sided movement of `amt` (signed) of `asset` in USDT.
    function valueLeg(asset, amt, ts) {
      if (STABLES[asset]) return amt;
      var h = hold(asset), p = priceAt(asset, ts);
      if (amt > 0) {
        if (p == null) (unvalued[asset] = unvalued[asset] || { asset: asset, qty: 0 }).qty += amt;
        var v = p == null ? 0 : amt * p;
        h.qty += amt; h.cost += v;
        return v;
      }
      var q = -amt, avg = h.qty > 1e-12 ? h.cost / h.qty : (p || 0);
      var covered = Math.min(q, h.qty), val = covered * avg + (q - covered) * (p || 0);
      h.qty = Math.max(0, h.qty - q);
      h.cost = h.qty > 1e-12 ? Math.max(0, h.cost - covered * avg) : 0;
      return -val;
    }

    rows.forEach(function (r) {
      var cat = classify(r.label);
      if (!cat) {
        cat = 'other';
        var k = r.label || '(blank)';
        unknown[k] = (unknown[k] || 0) + 1;
      }
      var fut = !!FUTURES_LABELS[r.label.toLowerCase()];
      var two = r.inAsset && r.outAsset;
      if (cat === 'conversion' || (two && cat !== 'realized')) {
        var outS = !!STABLES[r.outAsset], inS = !!STABLES[r.inAsset];
        if (two && outS && !inS) {
          var hb = hold(r.inAsset);
          hb.qty += r.inAmt; hb.cost += r.outAmt; hb.bought = true;
          push(r, 'conversion', 0, { detail: 'Bought ' + r.inAsset });
        } else if (two && !outS && inS) {
          var hs = hold(r.outAsset), bought = hs.bought;
          var basis = -valueLeg(r.outAsset, -r.outAmt, r.ts), pnl = r.inAmt - basis;
          if (bought) {
            push(r, 'spot', pnl, { market: 'spot' });
            trades.push({ ts: r.ts, seq: r.seq, market: 'spot', label: r.label + ' ' + r.outAsset, gross: pnl, fee: 0, net: pnl,
              account: r.account, ref: r.ref });
          } else push(r, 'spot', pnl, { market: 'spot', detail: 'Converted deposit' });
        } else if (two && outS && inS) {
          push(r, 'spot', r.inAmt - r.outAmt, { market: 'spot' });
        } else if (two) {
          var bs = -valueLeg(r.outAsset, -r.outAmt, r.ts), hi = hold(r.inAsset);
          hi.qty += r.inAmt; hi.cost += bs;
          push(r, 'conversion', 0, { detail: r.outAsset + ' → ' + r.inAsset });
        } else {
          var a0 = r.inAsset || r.outAsset;
          push(r, 'conversion', valueLeg(a0, r.inAsset ? r.inAmt : -r.outAmt, r.ts), { asset: a0 });
        }
      } else {
        var asset = r.inAsset || r.outAsset, qty = r.inAmt - r.outAmt;
        if (asset) {
          var v = valueLeg(asset, qty, r.ts);
          var e = push(r, cat, v, { asset: asset, qty: qty, market: fut ? 'futures' : null });
          if (cat === 'cashflow') e.flow = v >= 0 ? 'in' : 'out';
        }
      }
      if (r.feeAmt) {
        var fv = valueLeg(r.feeAsset || 'USDT', -Math.abs(r.feeAmt), r.ts);
        push(r, 'fee', fv, { market: fut ? 'futures' : 'spot', detail: 'Fee column' });
      }
    });

    // Futures trades: each realized event, paired with the nearest earlier unclaimed fee in the same minute.
    var feesByTs = {}, claimed = new Set();
    events.forEach(function (e) {
      if (e.cat === 'fee' && e.market === 'futures' && !e.detail) (feesByTs[e.ts] = feesByTs[e.ts] || []).push(e);
    });
    events.forEach(function (e) {
      if (e.cat !== 'realized') return;
      var cands = (feesByTs[e.ts] || []).filter(function (f) { return !claimed.has(f) && f.seq < e.seq && f.account === e.account; });
      var fee = 0;
      if (cands.length) {
        var f = cands.reduce(function (a, b) { return b.seq > a.seq ? b : a; });
        claimed.add(f); f.closing = true; fee = f.value;
      }
      trades.push({ ts: e.ts, seq: e.seq, market: 'futures', label: e.label, gross: e.value, fee: fee, net: e.value + fee,
        account: e.account, ref: e.row.ref });
    });
    trades.sort(function (a, b) { return a.ts - b.ts || a.seq - b.seq; });
    events.sort(function (a, b) { return a.ts - b.ts || a.seq - b.seq; });

    Object.keys(unknown).forEach(function (l) {
      warnings.push('Unknown label "' + l + '" on ' + unknown[l] + ' row(s). Counted as Other, outside PnL.');
    });
    var unv = Object.keys(unvalued).map(function (k) { return unvalued[k]; });
    unv.forEach(function (u) { warnings.push(u.qty.toPrecision(6) + ' ' + u.asset + ' has no USDT conversion in the file, so it is valued at 0.'); });
    var accounts = [];
    rows.forEach(function (r) { if (accounts.indexOf(r.account) < 0) accounts.push(r.account); });
    var other = Object.keys(holdings).filter(function (a) { return holdings[a].qty > 1e-12; })
      .map(function (a) { return { asset: a, qty: holdings[a].qty, cost: holdings[a].cost }; });
    return { meta: merged.meta, rows: rows, events: events, trades: trades, warnings: warnings, accounts: accounts,
      otherAssets: other, unvalued: unv, duplicates: merged.duplicates || 0 };
  }

  function loadReports(files) {
    return buildModel(mergeReports(files.map(function (f) { return parseReport(f.text, f.name); })));
  }

  // ---- analytics ----

  function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
  function mean(a) { return a.length ? sum(a) / a.length : null; }
  function sampleStd(a) {
    if (a.length < 2) return null;
    var m = mean(a);
    return Math.sqrt(sum(a.map(function (x) { return (x - m) * (x - m); })) / (a.length - 1));
  }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }

  function tradeStats(trades) {
    var nets = trades.map(function (t) { return t.net; });
    var wins = nets.filter(function (x) { return x > 0; }), losses = nets.filter(function (x) { return x < 0; });
    var gw = sum(wins), gl = sum(losses), cw = 0, cl = 0, mw = 0, ml = 0;
    nets.forEach(function (x) {
      if (x > 0) { cw++; cl = 0; } else if (x < 0) { cl++; cw = 0; } else { cw = 0; cl = 0; }
      mw = Math.max(mw, cw); ml = Math.max(ml, cl);
    });
    var decided = wins.length + losses.length, aw = mean(wins), al = mean(losses);
    return {
      count: trades.length, wins: wins.length, losses: losses.length, breakeven: trades.length - decided,
      winRate: decided ? wins.length / decided : null, grossWin: gw, grossLoss: gl, net: sum(nets),
      avgWin: aw, avgLoss: al, payoff: aw != null && al ? aw / Math.abs(al) : null,
      profitFactor: gl ? gw / Math.abs(gl) : (gw > 0 ? Infinity : null),
      expectancy: mean(nets), largestWin: wins.length ? Math.max.apply(null, wins) : null,
      largestLoss: losses.length ? Math.min.apply(null, losses) : null,
      maxWinStreak: mw, maxLossStreak: ml, closeFees: sum(trades.map(function (t) { return t.fee; }))
    };
  }

  function analyze(model, opts) {
    opts = Object.assign({ from: null, to: null, account: 'all', market: 'all', includeFees: true, includeFunding: true, includeIncome: true }, opts);
    var all = model.events.filter(function (e) { return opts.account === 'all' || e.account === opts.account; });
    if (!all.length) return null;
    var firstTs = all[0].ts, lastTs = all[all.length - 1].ts;
    var from = dayStart(opts.from != null ? opts.from : firstTs);
    var to = dayStart(opts.to != null ? opts.to : lastTs) + DAY - 1;
    var inRange = function (ts) { return ts >= from && ts <= to; };
    var isPerf = function (e) { return PERF[e.cat] && (opts.market === 'all' || e.market === opts.market); };
    var counted = function (e) {
      return isPerf(e) && !(e.cat === 'fee' && !opts.includeFees) && !(e.cat === 'funding' && !opts.includeFunding) &&
        !(e.cat === 'income' && !opts.includeIncome);
    };

    var equityStart = 0;
    all.forEach(function (e) { if (e.ts < from) equityStart += e.value; });
    var ev = all.filter(function (e) { return inRange(e.ts); });
    var perf = ev.filter(isPerf);
    var byCat = {};
    ev.forEach(function (e) { byCat[e.cat] = (byCat[e.cat] || 0) + e.value; });
    var catSum = function (c) { return sum(perf.filter(function (e) { return e.cat === c; }).map(function (e) { return e.value; })); };
    var fundEv = perf.filter(function (e) { return e.cat === 'funding'; });
    var flows = ev.filter(function (e) { return e.cat === 'cashflow'; });
    var totals = {
      realized: catSum('realized'), spot: catSum('spot'), event: catSum('event'), fees: catSum('fee'), funding: catSum('funding'),
      fundingReceived: sum(fundEv.filter(function (e) { return e.value > 0; }).map(function (e) { return e.value; })),
      fundingPaid: sum(fundEv.filter(function (e) { return e.value < 0; }).map(function (e) { return e.value; })),
      income: catSum('income'),
      deposits: sum(flows.filter(function (e) { return e.value > 0; }).map(function (e) { return e.value; })),
      withdrawals: sum(flows.filter(function (e) { return e.value < 0; }).map(function (e) { return e.value; })),
      internal: byCat.internal || 0, earn: byCat.earn || 0, bonus: byCat.bonus || 0,
      other: (byCat.other || 0) + (byCat.conversion || 0)
    };
    totals.netCapital = totals.deposits + totals.withdrawals;
    totals.gross = totals.realized + totals.spot + totals.event;
    totals.net = sum(perf.filter(counted).map(function (e) { return e.value; }));
    totals.equityStart = equityStart;
    totals.equityEnd = equityStart + sum(ev.map(function (e) { return e.value; }));
    var base = equityStart + totals.deposits;
    totals.roi = base > 0 ? totals.net / base : null;

    var trades = model.trades.filter(function (t) {
      return inRange(t.ts) && (opts.account === 'all' || t.account === opts.account) && (opts.market === 'all' || t.market === opts.market);
    });
    var stats = tradeStats(trades);

    // Equity curve (cumulative net and gross) with drawdown from the running peak (starts at 0).
    var curve = [{ ts: from, net: 0, gross: 0, dd: 0 }], cumNet = 0, cumGross = 0, peak = 0, maxDD = 0, maxDDAt = null;
    perf.forEach(function (e) {
      if (counted(e)) cumNet += e.value;
      if (e.cat === 'realized' || e.cat === 'spot' || e.cat === 'event') cumGross += e.value;
      if (cumNet > peak) peak = cumNet;
      var dd = cumNet - peak;
      if (dd < maxDD) { maxDD = dd; maxDDAt = e.ts; }
      curve.push({ ts: e.ts, net: cumNet, gross: cumGross, dd: dd });
    });

    // Daily series, one row per calendar day.
    var lastDay = Math.min(dayStart(to), dayStart(Math.max(lastTs, from)));
    var days = [], byDay = {};
    for (var d = from; d <= lastDay; d += DAY) {
      var o = { ts: d, day: dayKey(d), net: 0, realized: 0, fees: 0, funding: 0, income: 0, spot: 0, event: 0, flows: 0,
        trades: 0, wins: 0, losses: 0, equityStart: 0, equityEnd: 0, cumNet: 0, ret: null };

    }
    var eq = equityStart, ei = 0, cum = 0;
    days.forEach(function (dd) {
      dd.equityStart = eq;
      while (ei < ev.length && dayKey(ev[ei].ts) === dd.day) {
        var e = ev[ei++];
        eq += e.value;
        if (e.cat === 'cashflow') dd.flows += e.value;
        if (!isPerf(e)) continue;

        dd[key] += e.value;
      }

    });
    trades.forEach(function (t) {
      var dd = byDay[dayKey(t.ts)];
      if (!dd) return;
      dd.trades++;
      if (t.net > 0) dd.wins++; else if (t.net < 0) dd.losses++;
    });

    // Time-weighted returns on start-of-day balance, so deposits are not gains.
    var rets = [], idx = 1, idxPeak = 1, maxDDPct = 0;
    days.forEach(function (dd) {
      var b = dd.equityStart + Math.max(0, dd.flows);
      if (b <= 1e-9) return;
      dd.ret = dd.net / b; rets.push(dd.ret);
      idx *= 1 + dd.ret; idxPeak = Math.max(idxPeak, idx);

    });
    var rStd = sampleStd(rets), rMean = mean(rets);
    var down = rets.length > 1 ? Math.sqrt(sum(rets.map(function (x) { return Math.min(x, 0) * Math.min(x, 0); })) / rets.length) : null;
    var active = days.filter(function (x) { return x.net !== 0 || x.trades > 0; });
    var tDays = days.filter(function (x) { return x.trades > 0; });
    var green = tDays.filter(function (x) { return x.net > 0; }).length;
    var pick = function (arr, better) { return arr.length ? arr.reduce(function (a, b) { return better(b, a) ? b : a; }) : null; };
    var risk = {
      maxDD: maxDD, maxDDAt: maxDDAt, maxDDPct: maxDDPct, twr: idx - 1,
      sharpe: rStd ? (rMean / rStd) * Math.sqrt(365) : null,
      sortino: down ? (rMean / down) * Math.sqrt(365) : null,
      recovery: maxDD < 0 ? totals.net / Math.abs(maxDD) : null,
      bestDay: pick(active, function (b, a) { return b.net > a.net; }), worstDay: pick(active, function (b, a) { return b.net < a.net; }),
      tradingDays: tDays.length, greenDays: green, greenDayRate: tDays.length ? green / tDays.length : null, calendarDays: days.length
    };

    // Aggregates.
    function group(keyFn) {
      var m = {}, order = [];
      days.forEach(function (dd) {
        var k = keyFn(dd.ts);
        if (!m[k]) { m[k] = { key: k, net: 0, realized: 0, fees: 0, funding: 0, trades: 0, wins: 0, losses: 0 }; order.push(k); }
        var g = m[k];
        g.net += dd.net; g.realized += dd.realized + dd.spot + dd.event; g.fees += dd.fees; g.funding += dd.funding;
        g.trades += dd.trades; g.wins += dd.wins; g.losses += dd.losses;
      });
      return order.map(function (k) { return m[k]; });
    }
    var months = group(monthKey);
    months.forEach(function (m) {
      var s = tradeStats(trades.filter(function (t) { return monthKey(t.ts) === m.key; }));
      m.winRate = s.winRate; m.profitFactor = s.profitFactor; m.expectancy = s.expectancy;
    });
    var weeks = group(weekKey);
    var byWeekday = WEEKDAYS.map(function (n) { return { key: n, net: 0, trades: 0, wins: 0, losses: 0 }; });
    var byHour = []; for (var hh = 0; hh < 24; hh++) byHour.push({ key: hh, net: 0, trades: 0, wins: 0, losses: 0 });
    trades.forEach(function (t) {
      var dt = new Date(t.ts);
      [byWeekday[(dt.getUTCDay() + 6) % 7], byHour[dt.getUTCHours()]].forEach(function (g) {
        g.net += t.net; g.trades++;
        if (t.net > 0) g.wins++; else if (t.net < 0) g.losses++;
      });
    });

    // Histogram of trade results.
    var histogram = [];
    if (trades.length) {
      var nets = trades.map(function (t) { return t.net; });
      var lo = Math.min(0, Math.min.apply(null, nets)), hi = Math.max(0, Math.max.apply(null, nets)), span = hi - lo || 1;
      var raw = span / Math.max(6, Math.min(20, Math.ceil(Math.sqrt(trades.length) * 2)));
      var mag = Math.pow(10, Math.floor(Math.log10(raw)));
      var step = [1, 2, 2.5, 5, 10].map(function (s) { return s * mag; }).filter(function (s) { return s >= raw - 1e-12; })[0];
      var start = Math.floor(lo / step) * step, n = Math.floor((hi - start) / step + 1e-9) + 1;
      for (var bi = 0; bi < n; bi++) histogram.push({ lo: start + bi * step, hi: start + (bi + 1) * step, count: 0, sum: 0 });
      nets.forEach(function (x) {
        var b = histogram[Math.min(n - 1, Math.max(0, Math.floor((x - start) / step)))];
        b.count++; b.sum += x;
      });
    }

    // Funding by hour and positions held at each settlement.
    var fundingByHour = []; for (var fh = 0; fh < 24; fh++) fundingByHour.push({ key: fh, received: 0, paid: 0, count: 0 });
    var settle = {};
    fundEv.forEach(function (e) {
      var g = fundingByHour[new Date(e.ts).getUTCHours()];
      if (e.value > 0) g.received += e.value; else g.paid += e.value;
      g.count++; settle[e.ts] = (settle[e.ts] || 0) + 1;
    });
    var positions = Object.keys(settle).map(Number).sort(function (a, b) { return a - b; }).map(function (ts) { return { ts: ts, count: settle[ts] }; });

    // Costs.
    var costCurve = [], cf = 0, cu = 0;
    perf.forEach(function (e) {
      if (e.cat !== 'fee' && e.cat !== 'funding') return;
      if (e.cat === 'fee') cf += e.value; else cu += e.value;
      costCurve.push({ ts: e.ts, fees: cf, funding: cu, total: cf + cu });

    var absGross = sum(trades.map(function (t) { return Math.abs(t.gross); }));
    var costs = {
      feePctOfGross: absGross ? Math.abs(totals.fees) / absGross : null,
      feesPerTrade: trades.length ? totals.fees / trades.length : null,
      closeFees: stats.closeFees, openingFees: totals.fees - stats.closeFees,
      dragOnGross: totals.gross ? (totals.fees + totals.funding) / Math.abs(totals.gross) : null
    };

    // Trader score.
    var absDaily = active.map(function (x) { return Math.abs(x.net); });
    var bigShare = absDaily.length >= 2 ? Math.max.apply(null, absDaily) / (sum(absDaily) || 1) : null;
    var pf = stats.profitFactor === Infinity ? 3 : stats.profitFactor;
    var scoreParts = [
      { key: 'Win %', weight: 15, value: stats.winRate == null ? null : clamp01(stats.winRate / 0.6) },
      { key: 'Profit factor', weight: 25, value: pf == null ? null : clamp01(pf / 2.5) },
      { key: 'Avg win / loss', weight: 20, value: stats.payoff == null ? null : clamp01(stats.payoff / 2.5) },
      { key: 'Recovery', weight: 10, value: risk.recovery == null ? (totals.net > 0 ? 1 : null) : clamp01(risk.recovery / 3) },
      { key: 'Max drawdown', weight: 20, value: rets.length ? clamp01(1 - Math.abs(maxDDPct) / 0.5) : null },
      { key: 'Consistency', weight: 10, value: bigShare == null ? null : clamp01((1 - bigShare) / 0.8) }
    ];
    var known = scoreParts.filter(function (p) { return p.value != null; });
    var score = known.length ? sum(known.map(function (p) { return p.value * p.weight; })) / sum(known.map(function (p) { return p.weight; })) * 100 : null;

    return { opts: opts, range: { from: from, to: Math.max(from, lastDay), firstTs: firstTs, lastTs: lastTs }, totals: totals, stats: stats,
      risk: risk, curve: curve, days: days, months: months, weeks: weeks, byWeekday: byWeekday, byHour: byHour, histogram: histogram,
      trades: trades, fundingByHour: fundingByHour, positions: positions, costCurve: costCurve, costs: costs, score: score,
      scoreParts: scoreParts, flows: flows, events: ev };
  }

  function reconcile(model) {
    var rebuilt = sum(model.events.map(function (e) { return e.value; }));
    var c = model.meta.closing, reported = c && c.value != null ? c.value : null;
    return { rebuilt: rebuilt, reported: reported, diff: reported == null ? null : rebuilt - reported, at: c ? c.at : null,
      opening: model.meta.opening ? model.meta.opening.value : null };
  }

  function maskUid(uid) {
    if (!uid) return null;
    var s = String(uid);
    return s.length <= 5 ? s : s.slice(0, 2) + new Array(s.length - 4).join('•') + s.slice(-3);
  }

  // Deterministic demo export in the real Bitunix format.
  function demoCSV(seed) {
    var s = seed || 7;
    function rnd() { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }
    var end = Date.UTC(2026, 9, 17), start = end - 120 * DAY;
    function fmt(ts) {
      var d = new Date(ts);
      return d.getUTCFullYear() + '/' + (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + ' ' +
        String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
    }
    var lines = [], ref = 2000000000000000000;
    function R() { ref += Math.floor(rnd() * 900000 + 1000); return String(ref); }
    function out(ts, label, amt, type) { lines.push([ts, fmt(ts) + ',' + label + ',Main,USDT,' + amt + ',—,—,—,—,' + type + ',—,—,—,—,' + R() + ',-']); }
    function inc(ts, label, amt, type) { lines.push([ts, fmt(ts) + ',' + label + ',Main,—,—,USDT,' + amt + ',—,—,' + type + ',—,—,—,—,' + R() + ',-']); }
    inc(start + 9 * 3600000, 'Deposit', 1500, 'T0015');
    inc(start + 50 * DAY + 11 * 3600000, 'Deposit', 750, 'T0015');
    out(start + 100 * DAY + 15 * 3600000, 'Withdrawal', 400, 'T0016');
    var open = 0;
    for (var d = 1; d < 120; d++) {
      var day = start + d * DAY;
      [0, 8, 16].forEach(function (h) {
        for (var p = 0; p < open; p++) {
          var v = +(rnd() * 0.35).toFixed(6);
          if (rnd() < 0.62) out(day + h * 3600000, 'Funding Cost', v, 'T0045'); else inc(day + h * 3600000, 'Funding Cost', v, 'T0046');
        }
      });
      if (rnd() < 0.42) continue;
      var n = 1 + Math.floor(rnd() * 3);
      for (var k = 0; k < n; k++) {
        var t0 = day + Math.floor(rnd() * 22 + 1) * 3600000 + Math.floor(rnd() * 59) * 60000;
        var size = 300 + rnd() * 1700, hold = Math.floor(rnd() * 20 + 1) * 1800000;
        var r = (rnd() - 0.47) * 0.06 + (d > 70 ? 0.008 : 0.002), pnl = +(size * r).toFixed(4);
        out(t0, 'Futures Fee', +(size * 0.0006).toFixed(6), 'T0103');
        out(t0 + hold, 'Futures Fee', +(size * 0.0006).toFixed(6), 'T0103');
        if (pnl >= 0) inc(t0 + hold, 'PnL', pnl, 'T0041'); else out(t0 + hold, 'PnL', -pnl, 'T0042');
        if (hold > 8 * 3600000) open = Math.min(3, open + 1); else if (open > 0 && rnd() < 0.5) open--;
      }
      if (rnd() < 0.06) inc(day + 12 * 3600000, 'Referral Commission', +(rnd() * 4).toFixed(4), 'T0026');
    }
    lines.sort(function (a, b) { return a[0] - b[0]; });
    var head = ['Platform: Bitunix (demo data)', 'Export Date: ' + new Date(end).toISOString().slice(0, 16).replace('T', ' ') + ' UTC',
      'User UID: 100000042', 'Period: ' + dayKey(start) + ' ~ ' + dayKey(end),
      '"Opening Balance (' + dayKey(start) + ' 00:00:00 UTC, total account value in USDT): "',
      '----------------------------------------',
      'Date (UTC),Label,Account,Outgoing Asset,Outgoing Amount,Incoming Asset,Incoming Amount,Fee Asset,Fee Amount,Type ID,TXID,From Address,To Address,Network,Reference ID,Comment'];
    return head.concat(lines.map(function (l) { return l[1]; })).join('\n') + '\n';
  }

  root.PnLCore = { parseCSV: parseCSV, parseReport: parseReport, mergeReports: mergeReports, buildModel: buildModel,
    loadReports: loadReports, analyze: analyze, tradeStats: tradeStats, reconcile: reconcile, classify: classify,
